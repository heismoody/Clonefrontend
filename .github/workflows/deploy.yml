name: Deploy to Contabo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-contabo-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m

          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_NAME="clonefrontend"

            echo "==> Deploying to ${APP_DIR}"

            cd "${APP_DIR}"

            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Loading Node.js environment"
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 20.20.2

            echo "==> Checking Node.js and pnpm"
            node --version
            pnpm --version

            echo "==> Installing dependencies"
            pnpm install --frozen-lockfile

            echo "==> Building application"
            pnpm run build

            echo "==> Applying PM2 configuration"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

            echo "==> Checking PM2 status"
            pm2 status "${APP_NAME}"

            echo "==> Running application health check"
            
            for i in {1..30}; do
              if curl --fail --silent --show-error \
                http://127.0.0.1:3000 > /dev/null; then
                echo "==> Application is ready"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "==> Application failed to become ready"
                pm2 logs "${APP_NAME}" --lines 50 --nostream
                exit 1
              fi

              echo "==> Waiting for application... ($i/30)"
              sleep 2
            done

            echo "==> Deployment successful"